name: Nino
description: >-
  Experimental nino segment for dynamic routing

segmentId: NINO

entryEvents:
  startSegment:
    targetState: CRI_NINO

nestedJourneyStates:
  CRI_NINO:
    response:
      type: cri
      criId: nino
      evidenceRequest:
        scoringPolicy: gpg45
        strengthScore: 2
    parent: CRI_STATE
    events:
      next:
        exitEventToEmit: dr-segement-end-success
      access-denied:
        exitEventToEmit: dr-segement-end-failure
      fail-with-ci:
        exitEventToEmit: dr-segement-end-failure
      error:
        targetState: SORRY_CRI_TECHNICAL_PROBLEM_CRI_NINO

  SORRY_CRI_TECHNICAL_PROBLEM_CRI_NINO:
    response:
      type: page
      pageId: sorry-technical-problem
    events:
      tryAgain:
        targetState: CRI_NINO
#        FIRE-34 these are left-overs from re-using an existing page, we'd want a better named event here
      app:
        exitEventToEmit: dr-segement-end-failure-retryable
      postOffice:
        exitEventToEmit: dr-segement-end-failure-retryable
#        FIRE-34 do we want segments to allow the user to return to the RP?
      returnToRp:
        exitEventToEmit: return-to-rp
