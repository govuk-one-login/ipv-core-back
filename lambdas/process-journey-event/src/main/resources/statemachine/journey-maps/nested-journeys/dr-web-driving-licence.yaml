name: Web Driving Licence
description: >-
  Experimental web driving licence segment for dynamic routing

segmentId: WEB_DRIVING_LICENCE

entryEvents:
  startSegment:
    targetState: CRI_DRIVING_LICENCE

nestedJourneyStates:
  CRI_DRIVING_LICENCE:
    response:
      type: cri
      criId: drivingLicence
    parent: CRI_STATE
    events:
      next:
        exitEventToEmit: dr-segement-end-success
      access-denied:
        exitEventToEmit: dr-segement-end-failure
      fail-with-ci:
        exitEventToEmit: dr-segement-end-failure
      error:
        targetState: SORRY_CRI_TECHNICAL_PROBLEM_CRI_DRIVING_LICENCE

  SORRY_CRI_TECHNICAL_PROBLEM_CRI_DRIVING_LICENCE:
    response:
      type: page
      pageId: sorry-technical-problem
    events:
      tryAgain:
        targetState: CRI_DRIVING_LICENCE
#        FIRE-34 these are left-overs from re-using an existing page, we'd want a better named event here
      app:
        exitEventToEmit: dr-segement-end-failure-retryable
      postOffice:
        exitEventToEmit: dr-segement-end-failure-retryable
#        FIRE-34 do we want segments to allow the user to return to the RP?
      returnToRp:
        exitEventToEmit: return-to-rp
